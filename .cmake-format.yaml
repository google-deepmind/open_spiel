# Run manually to reformat a CMakeLists.txt:
#   cmake-format -c .cmake-format.yaml -i <file>
#
# Not run automatically.
bullet_char: '*'
dangle_parens: false
enum_char: .
line_ending: unix
line_width: 80
max_pargs_hwrap: 3
separate_ctrl_name_with_space: false
separate_fn_name_with_space: false
tab_size: 2
