name: build_and_test

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  # This allows manual triggering of workflows
  workflow_dispatch:
    inputs:
      name:
        description: 'Workflow dispatch (triggered manually)'
        required: false
        default: 'build_and_test (manual)'

permissions:
  contents: read

jobs:
  build:
    permissions:
      contents: write
    strategy:
      matrix:
        include:
        - os: ubuntu-26.04
          OS_PYTHON_VERSION: "3.14"
          DEFAULT_OPTIONAL_DEPENDENCY: "OFF"
          BUILD_SHARED_LIB: "OFF"
          OPEN_SPIEL_ABSL_VERSION: "20250814.1"
          OPEN_SPIEL_BUILD_WITH_ORTOOLS: "OFF"
          OPEN_SPIEL_BUILD_WITH_ORTOOLS_DOWNLOAD_URL: ""
        - os: ubuntu-24.04
          OS_PYTHON_VERSION: "3.14"
          DEFAULT_OPTIONAL_DEPENDENCY: "OFF"
          BUILD_SHARED_LIB: "OFF"
          OPEN_SPIEL_ABSL_VERSION: "20250814.1"
          OPEN_SPIEL_BUILD_WITH_ORTOOLS: "OFF"
          OPEN_SPIEL_BUILD_WITH_ORTOOLS_DOWNLOAD_URL: ""
        - os: ubuntu-24.04
          OS_PYTHON_VERSION: "3.13"
          DEFAULT_OPTIONAL_DEPENDENCY: "OFF"
          BUILD_SHARED_LIB: "OFF"
          OPEN_SPIEL_ABSL_VERSION: "20250814.1"
          OPEN_SPIEL_BUILD_WITH_ORTOOLS: "OFF"
          OPEN_SPIEL_BUILD_WITH_ORTOOLS_DOWNLOAD_URL: ""
        - os: ubuntu-24.04
          OS_PYTHON_VERSION: "3.12"
          DEFAULT_OPTIONAL_DEPENDENCY: "OFF"
          BUILD_SHARED_LIB: "OFF"
          OPEN_SPIEL_ABSL_VERSION: "20250814.1"
          OPEN_SPIEL_BUILD_WITH_ORTOOLS: "OFF"
          OPEN_SPIEL_BUILD_WITH_ORTOOLS_DOWNLOAD_URL: ""
        - os: macos-14
          OS_PYTHON_VERSION: "3.12"
          DEFAULT_OPTIONAL_DEPENDENCY: "OFF"
          BUILD_SHARED_LIB: "OFF"
          OPEN_SPIEL_ABSL_VERSION: "20250814.1"
          OPEN_SPIEL_BUILD_WITH_ORTOOLS: "OFF"
          OPEN_SPIEL_BUILD_WITH_ORTOOLS_DOWNLOAD_URL: ""
        - os: macos-14
          OS_PYTHON_VERSION: "3.11"
          TRAVIS_USE_NOX: 0
          DEFAULT_OPTIONAL_DEPENDENCY: "OFF"
          BUILD_SHARED_LIB: "OFF"
          OPEN_SPIEL_ABSL_VERSION: "20250814.1"
          OPEN_SPIEL_BUILD_WITH_ORTOOLS: "OFF"
          OPEN_SPIEL_BUILD_WITH_ORTOOLS_DOWNLOAD_URL: ""

    runs-on: ${{ matrix.os }}
    env:
      OPEN_SPIEL_ENABLE_JAX: ON
      OPEN_SPIEL_ENABLE_PYTORCH: ON
      OPEN_SPIEL_ENABLE_PYTHON_MISC: ON
      OPEN_SPIEL_ABSL_VERSION: ${{ matrix.OPEN_SPIEL_ABSL_VERSION }}
      OS_PYTHON_VERSION: ${{ matrix.OS_PYTHON_VERSION }}
      DEFAULT_OPTIONAL_DEPENDENCY: ${{ matrix.DEFAULT_OPTIONAL_DEPENDENCY }}
      OPEN_SPIEL_BUILD_WITH_JULIA: ${{ matrix.OPEN_SPIEL_BUILD_WITH_JULIA }}
      BUILD_SHARED_LIB:  ${{ matrix.BUILD_SHARED_LIB }}
      OPEN_SPIEL_BUILD_WITH_ORTOOLS:  ${{ matrix.OPEN_SPIEL_BUILD_WITH_ORTOOLS }}
      OPEN_SPIEL_BUILD_WITH_ORTOOLS_DOWNLOAD_URL:  ${{ matrix.OPEN_SPIEL_BUILD_WITH_ORTOOLS_DOWNLOAD_URL }}

    steps:

      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6.1.0
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.3.0
        with:
          python-version: ${{ matrix.OS_PYTHON_VERSION }}

      - name: Ad-hoc fix
        if: ${{ matrix.DEFAULT_OPTIONAL_DEPENDENCY == 'ON' }}
        run: |
          # workaround for https://github.com/deepmind/open_spiel/issues/606
          sudo cp /usr/lib/x86_64-linux-gnu/libstdc++.so.6 $(julia --startup-file=no -e 'using Libdl;print(abspath(joinpath(Libdl.dlpath("libjulia"), "..", "julia")))')
      - name: Install
        run: |
          pwd
          ./open_spiel/scripts/ci_python_prechecks.sh
          chmod +x install.sh
          ./install.sh
      - name: Build and test
        run: |
          python3 --version
          ./open_spiel/scripts/ci_script.sh
      # Tests tagged "manual" in the BUILD files (python/pytest_smoke:manual_test)
      # must reach CTest only with OPEN_SPIEL_RUN_MANUAL_TESTS=ON. Reconfiguring
      # the build directory of the previous step takes seconds: `ctest -N` only
      # lists the tests, nothing is built or run.
      - name: Check the OPEN_SPIEL_RUN_MANUAL_TESTS switch
        run: |
          source ./venv/bin/activate
          cd build
          ctest -N > ctest_off.txt
          grep -q ': python/pytest_smoke/smoke_test$' ctest_off.txt
          if grep -q ': python/pytest_smoke/manual_test$' ctest_off.txt; then
            echo "CTest has a manual test without OPEN_SPIEL_RUN_MANUAL_TESTS=ON."
            exit 1
          fi
          cmake -DOPEN_SPIEL_RUN_MANUAL_TESTS=ON ../open_spiel > /dev/null
          ctest -N > ctest_on.txt
          if ! grep -q ': python/pytest_smoke/manual_test$' ctest_on.txt; then
            echo "OPEN_SPIEL_RUN_MANUAL_TESTS=ON did not add the manual tests."
            exit 1
          fi

  # The per-package CMakeLists.txt files are generated from the BUILD.bazel
  # files. Fail if a change to a BUILD.bazel file was not followed by
  # regenerating them.
  generated_cmake_up_to_date:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6.1.0
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.3.0
        with:
          python-version: "3.12"

      - name: Regenerate CMakeLists.txt files
        run: bash ./open_spiel/scripts/generate_cmake.sh

      - name: Check that generated files are up to date
        run: |
          git status --porcelain
          if [[ -n "$(git status --porcelain)" ]]; then
            git diff
            echo "Generated CMake files are stale: run ./open_spiel/scripts/generate_cmake.sh and commit the result."
            exit 1
          fi

  bazel:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14]

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6.1.0
        with:
          persist-credentials: false

      # bazelisk is preinstalled as `bazel` on GitHub-hosted runners; it reads
      # the Bazel version from .bazelversion.
      - name: Bazel version
        run: bazel version

      - name: Build and test
        run: bazel test --keep_going //open_spiel/...

      - name: Build and test (optional C++ dependencies)
        run: bazel test --keep_going --config=optional //open_spiel/...

  # The JAX code under Bazel (opt-in group, off in the default config).
  bazel_jax:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6.1.0
        with:
          persist-credentials: false

      - name: Build and test (JAX)
        run: bazel test --keep_going --config=jax //open_spiel/python/...
