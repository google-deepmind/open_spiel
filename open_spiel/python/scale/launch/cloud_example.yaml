# Settings for the cloud launcher (launch/cloud.py); with PATH the path of
# this file:
#   python -m open_spiel.python.scale.launch.cloud --config_file=PATH
# Every key is a flag name; a flag on the command line wins. ${VAR} reads the
# environment, so you can leave this file as it is and run:
#   PROJECT=my-project BUCKET=my-bucket python -m open_spiel.python.scale.launch.cloud \
#       --config_file=PATH --dry_run
project: ${PROJECT}
bucket: ${BUCKET}
region: us-central1
zone: auto                    # every zone of the region in turn
machine_type: e2-standard-8
accelerator: none             # or e.g. nvidia-tesla-t4:1 (needs GPU quota)
spot: true                    # a preempted run resumes when relaunched with its run_id
max_run_hours: 2              # Compute Engine deletes the VM after this
service_account: default      # the Compute Engine default service account
run_id: auto
# The trainer's flags (the same as after `--` on the command line).
train_args:
  - --config=ppo_tic_tac_toe
# gcloud, or your organisation's wrapper taking the arguments of
# `gcloud compute instances create` (the VM name, then the flags).
create_command: gcloud
