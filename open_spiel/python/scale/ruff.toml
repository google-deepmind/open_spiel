line-length = 80
indent-width = 2

[lint]
# N818: exception names end in Error; S301: no pickle loads; PLC0415: imports
# at module level (pylint import-outside-toplevel).
select = ["E9", "F", "W605", "E501", "I", "D", "N818", "S301", "PLC0415"]
ignore = ["D105", "D107"]

[lint.per-file-ignores]
"**/tests/**" = ["D1"]
"**/*_test.py" = ["D1"]
"**/conftest.py" = ["D1"]

[lint.pydocstyle]
convention = "google"

[lint.isort]
force-single-line = true
force-sort-within-sections = true
# Imported names sort case-insensitively, constants among the rest (Google
# style, as the downstream import sorts them): order-by-type would put
# NUM_CARDS before get_card_points.
order-by-type = false
single-line-exclusions = ["typing", "collections.abc"]
# OpenSpiel and its extension module are first-party (staging #12, the
# importer's shared rules): pyspiel sorts with the open_spiel imports.
known-first-party = ["open_spiel", "pyspiel"]
