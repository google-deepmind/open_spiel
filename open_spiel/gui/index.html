<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>OpenSpiel</title>
    <!-- No icon: the page ships no images, and asks for none. -->
    <link rel="icon" href="data:," />
    <script>
      // Shows the stored theme before the first paint, so the page never
      // flashes the other one. Resolves the theme exactly as
      // src/theme/theme.ts does; ThemeProvider takes over once mounted and
      // reports an unknown stored value.
      (() => {
        let preference = null;
        try {
          preference = localStorage.getItem('open_spiel.theme');
        } catch {
          // Unreadable storage: follow the system, as ThemeProvider will.
        }
        const dark =
          preference === 'dark' ||
          (preference !== 'light' &&
            matchMedia('(prefers-color-scheme: dark)').matches);
        const theme = dark ? 'dark' : 'light';
        document.documentElement.dataset.theme = theme;
        document.documentElement.style.colorScheme = theme;
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./src/main.tsx"></script>
  </body>
</html>
