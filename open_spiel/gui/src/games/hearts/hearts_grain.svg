<!-- Drawn in code for this client: the hearts felt's faint grain, a procedural noise tile (feTurbulence) with no artwork, image or external reference. hearts_board.ts sets it on the table at the surface's grain opacity (hearts.css). -->
<svg viewBox='0 0 100 100' xmlns='http://www.w3.org/2000/svg'><filter id='noise'><feTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='4' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(#noise)'/></svg>
